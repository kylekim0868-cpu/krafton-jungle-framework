<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1-00·P1-01 검증</title>
    <style>
      body { font: 15px/1.6 system-ui, sans-serif; max-width: 1100px; margin: 32px auto; padding: 0 20px; }
      [data-result="passed"] { color: #14613d; }
      [data-result="failed"] { color: #b42318; }
      iframe { width: 100%; height: 700px; border: 1px solid #cad2e0; }
    </style>
  </head>
  <body>
    <h1>P1-00·P1-01 · DOM 변환·렌더와 초기화 검증</h1>
    <!-- 모듈을 불러오지 못하면 running 상태가 남는다. 결과가 없는 상태를 통과로 해석하지 않는다. -->
    <p id="summary" role="status" data-state="running">검증 준비 중</p>
    <ol id="results"></ol>
    <div id="demo"></div>
    <script type="module">
      import { assert, vdomTests } from '../unit/vdom.test.js';

      const results = document.querySelector('#results');
      const summary = document.querySelector('#summary');
      let passed = 0;
      let failed = 0;

      /**
       * 동기·비동기 검증을 하나씩 실행하고 이름·결과·실패 이유를 화면에 기록한다.
       * 개별 검증이 실패해도 다음 검증을 실행해 한 번에 전체 결과를 볼 수 있게 한다.
       * @param {string} name 화면에 표시할 검증 이름.
       * @param {Function} run 예외 발생 또는 Promise 거부로 실패를 알리는 검증 함수.
       * @returns {Promise<void>} 해당 검증의 결과 기록이 끝나면 완료된다.
       */
      async function test(name, run) {
        const item = document.createElement('li');
        try {
          await run();
          item.textContent = `통과: ${name}`;
          item.dataset.result = 'passed';
          passed += 1;
        } catch (error) {
          item.textContent = `실패: ${name} — ${error.message}`;
          item.dataset.result = 'failed';
          failed += 1;
        }
        results.appendChild(item);
      }

      // 단위 검사도 Node.js의 가짜 DOM이 아니라 현재 브라우저의 실제 DOM API로 실행한다.
      // await로 순서를 보장해 이전 검사가 끝나기 전에 다음 검사 결과를 집계하지 않는다.
      for (const [name, run] of vdomTests) await test(`단위 / ${name}`, run);

      // 같은 출처의 iframe에서 실제 데모 HTML과 모듈을 불러와 통합 경로를 검사한다.
      // 테스트만을 위한 별도 화면 구현으로 제품의 초기화 코드를 대체하지 않는다.
      const frame = document.createElement('iframe');
      frame.title = 'P1-00 기능 검증 대상';
      await test('기능 / 실제 데모 페이지 초기화', async () => {
        await new Promise((resolve, reject) => {
          // 네트워크 오류 등으로 load가 오지 않으면 영원히 대기하지 않고 실패로 기록한다.
          // 이벤트 처리를 먼저 연결한 뒤 주소를 지정하고 마운트해 빠른 로딩도 놓치지 않는다.
          const timeout = setTimeout(() => reject(new Error('Demo load timed out.')), 8000);
          frame.addEventListener('load', () => { clearTimeout(timeout); resolve(); }, { once: true });
          frame.src = '../../demos/phase1/';
          document.querySelector('#demo').appendChild(frame);
        });
        // load 이벤트만으로 제품 초기화 성공을 단정하지 않는다.
        // 데모 모듈이 오류를 처리했을 수도 있으므로 명시적인 초기화 상태를 함께 확인한다.
        assert(frame.contentDocument.documentElement.dataset.appState === 'ready', 'Demo did not initialize.');
      });

      await test('기능 / 실제·테스트 영역의 초기 샘플이 일치하고 서로 다른 노드다', () => {
        // 같은 모양인지(isEqualNode)와 같은 객체인지(참조 비교)는 서로 다른 조건이다.
        const doc = frame.contentDocument;
        const source = doc.querySelector('#actual-area').firstElementChild;
        const rendered = doc.querySelector('#test-area').firstElementChild;
        assert(source.isEqualNode(rendered), 'Initial trees do not match.');
        assert(source !== rendered, 'Source and target are the same node.');
      });

      await test('기능 / Patch는 사용할 수 있고 이력 버튼은 표시되며 비활성화된다', () => {
        const buttons = Array.from(frame.contentDocument.querySelectorAll('.toolbar button'));
        assert(buttons.map((button) => button.textContent).join(',') === 'Patch,뒤로가기,앞으로가기', 'Missing controls.');
        assert(buttons.every((button) => button.getBoundingClientRect().width > 0), 'Controls are hidden.');
        assert(!buttons[0].disabled && buttons[1].disabled && buttons[2].disabled, 'Wrong controls state.');
      });

      await test('기능 / 편집 영역은 키보드 초점을 받고 편집할 수 있다', () => {
        // 편집 가능 속성과 초점 이동을 확인한다. 실제 키 입력·한글 조합 입력은 직접 확인 대상이다.
        const doc = frame.contentDocument;
        const editor = doc.querySelector('#test-area');
        assert(editor.isContentEditable, 'Editor is not editable.');
        editor.focus();
        assert(doc.activeElement === editor, 'Editor cannot receive focus.');
        assert(!doc.querySelector('#actual-area').isContentEditable, 'Source is editable.');
      });

      await test('기능 / 테스트 영역을 변경해도 원본은 유지된다', () => {
        // 이 검사는 DOM API로 편집 결과를 만든다. 실제 사용자의 키 입력을 자동 재현하지는 않는다.
        // 원본의 HTML과 자식 참조를 함께 비교해 편집 영역과 원본의 독립성을 확인한다.
        const doc = frame.contentDocument;
        const source = doc.querySelector('#actual-area').firstElementChild;
        const original = source.outerHTML;
        const originalChild = source.firstChild;
        doc.querySelector('#test-area h3').textContent = '테스트 영역만 수정';
        assert(source.outerHTML === original && source.firstChild === originalChild, 'Source changed after edit.');
        assert(doc.querySelector('#test-area h3').textContent === '테스트 영역만 수정', 'Edit failed.');
      });

      // 모든 등록 검사를 실행한 뒤 집계한다. passed는 이 검사 목록의 결과이며
      // 요구사항 전체 충족이나 사용자의 최종 수용을 대신하지 않는다.
      summary.textContent = `통과 ${passed} / 실패 ${failed} / 전체 ${passed + failed}`;
      summary.dataset.state = failed === 0 ? 'passed' : 'failed';
      summary.dataset.passed = passed;
      summary.dataset.failed = failed;
    </script>
  </body>
</html>
